name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build & release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build mobile web bundle and sync Capacitor
        working-directory: frontend
        run: npm run build:mobile

      - name: Assemble debug APK
        working-directory: frontend/android
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/gemak-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemak-android-apk
          path: dist-apk/gemak-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'android-latest' }}
          name: "${{ startsWith(github.ref, 'refs/tags/') && format('چيمك {0}', github.ref_name) || format('چيمك — نسخة أندرويد {0}', github.run_number) }}"
          body: |
            نسخة أندرويد من **چيمك** بعد الهوية العربية ودعم RTL.

            1. نزّل ملف `gemak-debug.apk`
            2. على الموبايل: اسمح بالتثبيت من مصادر غير معروفة
            3. افتح الملف وثبّت التطبيق

            اللغة الأساسية عربي مصري، والاتجاه من اليمين لليسار.
          files: dist-apk/gemak-debug.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: true
          generate_release_notes: true
