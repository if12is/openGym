name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build & release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache signing keystore
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: frontend/android/app/gemak-debug.keystore
          key: gemak-keystore-v1

      - name: Create signing keystore
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair \
            -keystore frontend/android/app/gemak-debug.keystore \
            -alias gemak -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass gemakdebug -keypass gemakdebug \
            -dname "CN=Gemak, OU=Mobile, O=Gemak, L=Cairo, ST=Cairo, C=EG"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 36 to match compileSdkVersion — Health Connect's client library will not
      # link against anything older. targetSdk stays at 35 (see variables.gradle).
      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Bump Android version
        run: node scripts/bump-android-version.mjs ${{ github.run_number }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build mobile web bundle
        working-directory: frontend
        run: npm run build:mobile

      - name: Point Gradle at the Android SDK
        working-directory: frontend/android
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

      - name: Assemble debug APK
        working-directory: frontend/android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      # Job logs can only be downloaded by a repo admin, but check annotations are
      # readable by anyone — so a red build is diagnosable without handing out
      # admin rights, and without re-running it locally.
      - name: Surface Gradle error
        if: failure()
        run: |
          tail -n 120 frontend/android/gradle-build.log || true
          grep -aE "^e: |error:|FAILURE:|What went wrong|Caused by:|Unresolved reference|Execution failed|Compilation error" \
            frontend/android/gradle-build.log 2>/dev/null | head -n 25 | tr -d '\r' | while IFS= read -r line; do
              echo "::error::${line}"
            done || true

      - name: Name the APK
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/gemak-debug.apk
          cp frontend/android/app-version.json dist-apk/app-version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemak-android-apk
          path: dist-apk/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'android-latest' }}
          name: "${{ startsWith(github.ref, 'refs/tags/') && format('چيمك {0}', github.ref_name) || format('چيمك — نسخة أندرويد {0}', github.run_number) }}"
          body: |
            نسخة أندرويد من **چيمك**.

            1. من الإعدادات → **تحديث التطبيق** → نزّل وثبّت (أو نزّل `gemak-debug.apk` يدوياً)
            2. التحديث بيتثبت **فوق النسخة القديمة** — مش محتاج تمسحها
            3. من الإعدادات → **التمارين بدون نت** → نزّل الصور والحركات (~140 ميجا)

            اللغة الأساسية عربي مصري، والاتجاه من اليمين لليسار.
          files: |
            dist-apk/gemak-debug.apk
            dist-apk/app-version.json
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: true
          generate_release_notes: true
