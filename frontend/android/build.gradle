// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        // connect-client 1.1.0 requires AGP 8.9.1+. 8.10.1 is the newest that
        // still runs on Gradle 8.11.1 (AGP 8.11 wants Gradle 8.13), so this is
        // the bump that does not also drag the wrapper along.
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        // Health Connect's client API is coroutine-based (every read is a suspend
        // function), so the plugin that wraps it is Kotlin. Version is repeated
        // here rather than read from variables.gradle because buildscript{} is
        // evaluated before that file is applied.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    def kv = rootProject.ext.has('kotlin_version') ? rootProject.ext.kotlin_version : '2.0.21'
    configurations.configureEach {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:$kv"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kv"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kv"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
