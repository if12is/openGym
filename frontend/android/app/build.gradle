apply plugin: 'com.android.application'
// Capacitor's filesystem plugin already registers a kotlin extension on some
// AGP lines. Applying twice fails the whole assemble with "Cannot add extension
// with name 'kotlin'".
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

android {
    namespace "ch.duartesantos.opengym"
    compileSdk rootProject.ext.compileSdkVersion
    // Matches @capacitor/android, which compiles at 21. A module that disagrees
    // with the library it links against fails at the desugaring step, not at the
    // line that caused it, which is a miserable error to read.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    packaging {
        resources {
            pickFirsts += 'META-INF/*.kotlin_module'
            pickFirsts += 'META-INF/INDEX.LIST'
            pickFirsts += 'META-INF/io.netty.versions.properties'
        }
    }
    defaultConfig {
        applicationId "ch.duartesantos.opengym"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.5.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // Read from agconnect-services.json when the developer has dropped the
        // AppGallery Connect file in. "0" means Health Kit sign-in will refuse
        // with not-configured instead of a cryptic 6003.
        def huaweiAppId = '0'
        def agc = file('agconnect-services.json')
        if (agc.exists()) {
            try {
                def json = new groovy.json.JsonSlurper().parse(agc)
                def id = json.client?.app_id ?: json.app_info?.app_id
                if (id && id != 'YOUR_HUAWEI_APP_ID') huaweiAppId = id.toString()
            } catch (Exception ignored) { /* placeholder json is fine */ }
        }
        if (project.hasProperty('HUAWEI_APP_ID')) {
            huaweiAppId = project.property('HUAWEI_APP_ID').toString()
        }
        resValue "string", "huawei_app_id", huaweiAppId
        manifestPlaceholders += [HUAWEI_APP_ID: huaweiAppId]
    }
    signingConfigs {
        debug {
            def ks = file('gemak-debug.keystore')
            if (ks.exists()) {
                storeFile ks
                storePassword 'gemakdebug'
                keyAlias 'gemak'
                keyPassword 'gemakdebug'
            }
        }
    }
    buildTypes {
        debug {
            if (signingConfigs.debug.storeFile != null) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.debug.storeFile != null) {
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Health Connect remains the fallback on GMS phones. Huawei Health Kit is
    // the default on HMS devices — Health Connect's client bind hangs there.
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    implementation "com.huawei.hms:health:$huaweiHealthVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

try {
    def agc = file('agconnect-services.json')
    if (agc.exists() && agc.text.contains('"app_id"') && !agc.text.contains('YOUR_HUAWEI_APP_ID')) {
        apply plugin: 'com.huawei.agconnect'
    }
} catch(Exception e) {
    logger.info("agconnect-services.json not applied")
}
