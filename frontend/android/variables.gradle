ext {
    // 26, not 23, because Health Connect starts at Android 8.0 and
    // androidx.health.connect:connect-client declares minSdk 26 itself — the
    // manifest merger fails the build outright below that, so "disable the
    // feature gracefully on old phones" was never an option. Android 8 shipped
    // in 2017 and no device that old can talk to a Watch Fit 4 anyway.
    minSdkVersion = 26
    // 36 because androidx.health.connect:connect-client 1.1.0 refuses to be
    // consumed by anything compiled against less ("requires libraries and
    // applications that depend on it to compile against version 36 or later").
    // Compiling against 36 only makes the newer APIs visible; it does not opt the
    // app into Android 16 runtime behaviour — that is targetSdk, left at 35 on
    // purpose so edge-to-edge enforcement doesn't silently reshape the UI.
    compileSdkVersion = 36
    targetSdkVersion = 35
    // Property name Capacitor plugins look up (kotlin_version, not kotlinVersion).
    kotlin_version = '2.0.21'
    // 1.1.0 stable — the third-party Capacitor health plugins are still on
    // 1.1.0-alpha10 / 1.2.0-alpha01.
    healthConnectVersion = '1.1.0'
    // Official Health Kit demo pins 6.11.0.303. Newer 6.x lines keep the same
    // DataController / SettingController surface this plugin calls.
    huaweiHealthVersion = '6.11.0.303'
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}